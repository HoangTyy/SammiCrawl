services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_PASSWORD: fixture-only-password
      POSTGRES_DB: crawl_lock_fixture
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d crawl_lock_fixture"]
      interval: 1s
      timeout: 3s
      retries: 30
  checks:
    build:
      context: ../..
      dockerfile: tests/CrawlLockChecks/Dockerfile
    environment:
      PG_TEST_CONNECTION: Host=db;Database=crawl_lock_fixture;Username=postgres;Password=fixture-only-password
    depends_on:
      db:
        condition: service_healthy
